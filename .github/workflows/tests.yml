name: Java tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: bash ./mvnw --batch-mode --no-transfer-progress test

      - name: Verify archived Actuator task 097
        run: bash ./mvnw --batch-mode --no-transfer-progress -f tasks/completed/task_097_bank_actuator_probes/pom.xml test

      - name: Verify archived logging task 098
        run: bash ./mvnw --batch-mode --no-transfer-progress -f tasks/completed/task_098_bank_expense_logging/pom.xml clean test

      - name: Verify archived Kafka task 099
        run: bash ./mvnw --batch-mode --no-transfer-progress -DfailIfNoTests=true -f tasks/completed/task_099_bank_kafka_notifications/pom.xml clean test

      - name: Keep course test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-test-reports
          path: |
            tasks/completed/task_097_bank_actuator_probes/target/surefire-reports/
            tasks/completed/task_098_bank_expense_logging/target/surefire-reports/
            tasks/completed/task_099_bank_kafka_notifications/target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn
