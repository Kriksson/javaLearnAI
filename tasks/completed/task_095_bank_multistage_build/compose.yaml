services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BANK_HTTP_PORT:-8085}:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/${BANK_DB_NAME:-bank_lab}"
      SPRING_DATASOURCE_USERNAME: "${BANK_DB_USER:-bank_app}"
      SPRING_DATASOURCE_PASSWORD: "${BANK_DB_PASSWORD:-learning-only}"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${BANK_DB_NAME:-bank_lab}"
      POSTGRES_USER: "${BANK_DB_USER:-bank_app}"
      POSTGRES_PASSWORD: "${BANK_DB_PASSWORD:-learning-only}"
    volumes:
      - bank_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h db -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 1s
      timeout: 1s
      retries: 5
      start_period: 5s
volumes:
  bank_data:
